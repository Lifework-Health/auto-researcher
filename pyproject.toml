[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-researcher"
version = "2.1.0"
description = "A typed, resumable LangGraph control plane for bounded scientific research."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph==1.2.10",
    "langgraph-checkpoint-sqlite==3.1.0",
    "pydantic==2.13.4",
    "PyYAML==6.0.3",
    "typer==0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
]
hpo = [
    "optuna>=4.9,<5",
]
agents = [
    "langchain-core==1.5.3",
]
agents-anthropic = [
    "langchain-core==1.5.3",
    "langchain-anthropic==1.5.3",
]
knowledge-neo4j = [
    "neo4j==6.2.0",
]
openevolve = [
    "openevolve==0.3.2",
]
feta = [
    "numpy==2.0.2",
    "nibabel==5.3.3",
    "scipy==1.18.0",
    "torch==2.8.0",
    "monai==1.5.1",
]

[project.scripts]
auto-researcher = "auto_researcher.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"auto_researcher.prompts" = ["**/*.md"]
"auto_researcher.knowledge" = ["queries/**/*.cypher"]
"auto_researcher.tasks.iris_knn" = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "hpo: optional tests requiring the Optuna hpo extra",
    "v2: optional contract tests requiring the auto_agent_v2 package",
    "real_data: optional iCCA compatibility gate requiring explicit local data",
    "live_agent: optional paid provider smoke tests requiring explicit environment opt-in",
    "hardened_executor: local OCI isolation gate requiring an explicitly built pinned image",
    "upstream_openevolve: optional tests requiring the pinned upstream dependency",
    "feta_data: opt-in tests requiring the local FeTA 2.1 export",
    "gpu: opt-in tests requiring CUDA and the FeTA ML extra",
]
