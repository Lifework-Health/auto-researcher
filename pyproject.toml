[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-researcher"
version = "2.1.0"
description = "A typed, resumable LangGraph control plane for bounded scientific research."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph==1.2.10",
    "langgraph-checkpoint-sqlite==3.1.0",
    "pydantic==2.13.4",
    "PyYAML==6.0.3",
    "typer==0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
]
hpo = [
    "optuna>=4.9,<5",
]

[project.scripts]
auto-researcher = "auto_researcher.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "hpo: optional tests requiring the Optuna hpo extra",
    "v2: optional contract tests requiring the auto_agent_v2 package",
    "real_data: optional iCCA compatibility gate requiring explicit local data",
]
