runtime:
  data_dir: /absolute/path/to/feta
  output_dir: /absolute/path/to/openevolve-development-output
  workspace_dir: /absolute/path/to/openevolve-development-workspace
  options:
    # Replace these values and observations from the same completed Optuna study.
    base_configuration:
      fold: 0
      maximum_epochs: 25
      learning_rate: 0.0001
      weight_decay: 0.00001
      dropout: 0.2
      dice_weight: 1.0
      positive_negative_ratio: "1:1"
      augmentation_strength: baseline
    # Aggregate metrics only; do not include paths, subject rows or predictions.
    hpo_observations: []
