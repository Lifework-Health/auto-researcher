    maximum_output_tokens: 4096
    maximum_cost_per_call: 0.75
    maximum_research_director_output_tokens: 64000
    maximum_research_director_cost_per_call: 8.0
    maximum_total_model_calls: 768
  research_director:
    provider: anthropic
    model_id: claude-opus-5
    pricing: {version: anthropic-opus5-usd-5-25-v1, input_cost_per_million_tokens: 5.0, output_cost_per_million_tokens: 25.0, cache_write_cost_per_million_tokens: null, cache_read_cost_per_million_tokens: null, currency: USD}
