    thinking: {type: adaptive}
    effort: xhigh
    maximum_output_tokens: 64000
    timeout_seconds: 900
    maximum_attempts: 4
    maximum_cost_per_call: 8.0
    prompt_version: 2.0.0
    structured_output_strategy: pydantic
  hypothesis: {temperature: 0.0, maximum_output_tokens: 3000, timeout_seconds: 180, maximum_attempts: 4, maximum_cost_per_call: 0.75, prompt_version: 2.0.0, structured_output_strategy: pydantic}
