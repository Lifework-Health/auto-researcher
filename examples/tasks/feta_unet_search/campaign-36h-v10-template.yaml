openevolve_development_mutation:
  protocol_version: development-live-openevolve-runtime-v1
  mode: local_development
  acknowledgement: public-data-non-production-development
  maximum_model_calls: 100
  maximum_total_cost_usd: 50.0
  usage_log_file: /absolute/path/to/runtime/openevolve-model-usage.jsonl
  credential: {logical_name: anthropic_api_key, provider: linux_kernel_keyring, provider_identifier: auto-researcher/anthropic-api-key, version: null, required: true}
  model:
    provider: anthropic
    model_id: claude-sonnet-4-5-20250929
    temperature: 0.25
    maximum_output_tokens: 4096
    timeout_seconds: 180
    maximum_attempts: 1
    maximum_cost_per_call: 0.50
    prompt_version: openevolve-mutation-prompt-v2
    structured_output_strategy: pydantic
    pricing: {version: anthropic-sonnet45-usd-3-15-v1, input_cost_per_million_tokens: 3.0, output_cost_per_million_tokens: 15.0, cache_write_cost_per_million_tokens: null, cache_read_cost_per_million_tokens: null, currency: USD}

experiment: &v10_first_root
  maximum_epochs: 30
  model_variant: dynunet
  feature_width: v8_dyn_compact_5
  architecture_budget: dynunet-15m-150m-v1
  upsample: deconv
  kernel_profile: large_front
  residual_blocks: true
  deep_supervision_heads: 1
  activation: ReLU
  norm: instance
  optimizer: AdamW
  lr_schedule: cosine
  loss_variant: dice_focal
  learning_rate: 0.0001129297960052267
  weight_decay: 0.00001516410659573061
  dropout: 0.022853564045494074
  dice_weight: 1.3287448814674725
  positive_negative_ratio: "2:1"
  sampling_policy: foreground
  augmentation_policy: combined

runtime:
  data_dir: /absolute/path/to/feta
  output_dir: /absolute/path/to/runtime/output
  workspace_dir: /absolute/path/to/runtime/workspace
  environment: {CUDA_VISIBLE_DEVICES: "1"}
  options:
    protected_storage_acknowledged: true
    workspace_namespace: feta_unet_campaign_v10
    shared_preprocessing_cache: true
    campaign_duration_seconds: 129600
    campaign_finalisation_reserve_seconds: 28800
    campaign_reporting_reserve_seconds: 1800
    campaign_prior_results: 30
    openevolve_fidelity: 30
    continue_after_failed_candidate: true
    maximum_peak_gpu_memory_bytes: 47244640256
    launch_gate: blocked_pending_v10_action_preflight
    planner_allocation_mode: deterministic_campaign_portfolio_compiler
    research_director_strategy_authority: advisory_typed_directives
    literature_scout_mode: prelaunch_reviewed_freeze
    v10_bound_evidence_file: /absolute/path/to/v10-bound-evidence.json
    v10_fidelity_ladder: [30, 50, 100, 150]
    v10_fixed_roots: &v10_fixed_roots
      - *v10_first_root
      - {maximum_epochs: 30, model_variant: dynunet, feature_width: v8_dyn_compact_5, architecture_budget: dynunet-15m-150m-v1, upsample: deconv, kernel_profile: large_front, residual_blocks: true, deep_supervision_heads: 1, activation: ReLU, norm: instance, optimizer: AdamW, lr_schedule: cosine, loss_variant: generalized_dice_focal, learning_rate: 0.0001129297960052267, weight_decay: 0.00001516410659573061, dropout: 0.022853564045494074, dice_weight: 1.3287448814674725, positive_negative_ratio: "2:1", sampling_policy: weak_tissue_balanced, augmentation_policy: combined}
      - {maximum_epochs: 30, model_variant: dynunet, feature_width: v8_dyn_compact_5, architecture_budget: dynunet-15m-150m-v1, upsample: deconv, kernel_profile: large_front, residual_blocks: true, deep_supervision_heads: 1, activation: ReLU, norm: instance, optimizer: AdamW, lr_schedule: cosine, loss_variant: dice_tversky, learning_rate: 0.0001129297960052267, weight_decay: 0.00001516410659573061, dropout: 0.022853564045494074, dice_weight: 1.3287448814674725, positive_negative_ratio: "2:1", sampling_policy: weak_tissue_balanced, augmentation_policy: combined}
      - {maximum_epochs: 30, model_variant: dynunet, feature_width: v8_dyn_balanced_5, architecture_budget: dynunet-15m-150m-v1, upsample: deconv, kernel_profile: large_front, residual_blocks: true, deep_supervision_heads: 1, activation: ReLU, norm: instance, optimizer: AdamW, lr_schedule: cosine, loss_variant: dice_focal, learning_rate: 0.00009998128596953582, weight_decay: 0.00003169120549037142, dropout: 0.020533315187031203, dice_weight: 1.490841963425817, positive_negative_ratio: "3:1", sampling_policy: foreground, augmentation_policy: intensity}
      - {maximum_epochs: 30, model_variant: dynunet, feature_width: v8_dyn_balanced_5, architecture_budget: dynunet-15m-150m-v1, upsample: deconv, kernel_profile: large_front, residual_blocks: true, deep_supervision_heads: 1, activation: ReLU, norm: instance, optimizer: AdamW, lr_schedule: cosine, loss_variant: generalized_dice_focal, learning_rate: 0.00009998128596953582, weight_decay: 0.00003169120549037142, dropout: 0.020533315187031203, dice_weight: 1.490841963425817, positive_negative_ratio: "3:1", sampling_policy: weak_tissue_balanced, augmentation_policy: intensity}
