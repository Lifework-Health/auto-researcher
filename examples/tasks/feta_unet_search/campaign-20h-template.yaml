# Development-only, single-GPU, staged 20-hour BasicUNet campaign.
# Screening: 36 OPTUNA + 12 OPENEVOLVE + 12 DIRECT at 25 epochs.
# Graduation: 18 at 50, 7 at 100, and 2 at 150 epochs.
task: {id: feta_unet_search, version: "1.0"}

agents:
  mode: live
  provider: anthropic
  model_id: claude-sonnet-4-5-20250929
  pricing:
    version: anthropic-sonnet45-usd-3-15-v1
    input_cost_per_million_tokens: 3.0
    output_cost_per_million_tokens: 15.0
    cache_write_cost_per_million_tokens: null
    cache_read_cost_per_million_tokens: null
    currency: USD
  budget:
    maximum_hypothesis_calls_per_cycle: 1
    maximum_planner_calls_per_cycle: 1
    maximum_attempts_per_agent_call: 4
    maximum_input_context_size: 48000
    maximum_output_tokens: 2048
    maximum_cost_per_call: 0.50
    maximum_total_model_calls: 192
  hypothesis:
    temperature: 0.0
    maximum_output_tokens: 1200
    timeout_seconds: 120
    maximum_attempts: 4
    maximum_cost_per_call: 0.50
    prompt_version: 2.0.0
    structured_output_strategy: pydantic
  planner:
    temperature: 0.0
    maximum_output_tokens: 1600
    timeout_seconds: 120
    maximum_attempts: 4
    maximum_cost_per_call: 0.50
    prompt_version: 2.0.0
    structured_output_strategy: pydantic

openevolve_development_mutation:
  protocol_version: development-live-openevolve-runtime-v1
  mode: local_development
  acknowledgement: public-data-non-production-development
  maximum_model_calls: 48
  maximum_total_cost_usd: 50.0
  usage_log_file: /absolute/path/to/runtime/openevolve-model-usage.jsonl
  credential:
    logical_name: anthropic_api_key
    provider: environment
    provider_identifier: ANTHROPIC_API_KEY
    version: null
    required: true
  model:
    provider: anthropic
    model_id: claude-sonnet-4-5-20250929
    temperature: 0.2
    maximum_output_tokens: 4096
    timeout_seconds: 180
    maximum_attempts: 1
    maximum_cost_per_call: 0.40
    prompt_version: openevolve-mutation-prompt-v2
    structured_output_strategy: pydantic
    pricing:
      version: anthropic-sonnet45-usd-3-15-v1
      input_cost_per_million_tokens: 3.0
      output_cost_per_million_tokens: 15.0
      cache_write_cost_per_million_tokens: null
      cache_read_cost_per_million_tokens: null
      currency: USD

# OPTUNA opens durable study storage. The campaign portfolio below owns the
# method mix and graduation order; live agents still supply scientific context.
search:
  type: OPTUNA
  trial_budget: 36
  seed: 20260815
  fixed:
    maximum_epochs: 25
  openevolve:
    population_size: 1
    maximum_generations: 2
    maximum_candidate_evaluations: 13
    maximum_wall_time_seconds: 72000
    maximum_model_calls: 2
    maximum_failed_candidates: 2
    maximum_consecutive_failures: 2
    maximum_artefact_bytes: 20000000
    random_seed: 20260815
    objective_direction: MAXIMIZE
    objective_threshold: null
    sandbox_policy_id: openevolve-sandbox-v1
    candidate_cpu_time_seconds: 2
    candidate_wall_time_seconds: 3.0
    candidate_memory_bytes: 268435456
    candidate_process_limit: 1
    candidate_output_bytes: 64000
    candidate_log_bytes: 8000
    candidate_file_count_limit: 8
    candidate_workspace_bytes: 1048576
    candidate_file_size_bytes: 64000

runtime:
  data_dir: /absolute/path/to/feta
  output_dir: /absolute/path/to/runtime/output
  workspace_dir: /absolute/path/to/runtime/workspace
  environment:
    CUDA_VISIBLE_DEVICES: "0"
  options:
    protected_storage_acknowledged: true
    workspace_namespace: feta_unet_campaign_v4
    shared_preprocessing_cache: true
    openevolve_fidelity: 25
    # Replace with the measured p90 seconds/epoch from the host baseline.
    campaign_seconds_per_epoch: 22.0
    campaign_finalisation_reserve_seconds: 10800.0
    campaign_prior_results: 30
    # Record a failed candidate as inconclusive evidence and continue the campaign.
    continue_after_failed_candidate: true
    # Replace from the completed, verified fold-0 baseline before launch.
    initial_incumbent_configuration:
      maximum_epochs: 150
      learning_rate: 0.0001
      weight_decay: 0.000001
      dropout: 0.0
      dice_weight: 1.2
      positive_negative_ratio: "1:1"
      augmentation_strength: baseline
    # Aggregate results only; no paths, rows, images, masks or predictions.
    initial_campaign_observations:
      - search_type: DIRECT
        primary_score: 0.812891818509455
        configuration:
          maximum_epochs: 150
          learning_rate: 0.0001
          weight_decay: 0.000001
          dropout: 0.0
          dice_weight: 1.2
          positive_negative_ratio: "1:1"
          augmentation_strength: baseline
        aggregate_metrics:
          best_epoch: 120
          evidence_status: SUPPORTED
    campaign_portfolio:
      version: feta-unet-60-18-7-2-portfolio-v1
      screening:
        OPTUNA: 36
        OPENEVOLVE: 12
        DIRECT: 12
      promotion_targets:
        "50": 18
        "100": 7
        "150": 2
      wildcard_counts:
        "50": 2
        "100": 1
        "150": 0
      direct_screening_configurations:
        - {maximum_epochs: 25, learning_rate: 0.00005, weight_decay: 0.000001, dropout: 0.0, dice_weight: 1.2, positive_negative_ratio: "1:1", augmentation_strength: baseline}
        - {maximum_epochs: 25, learning_rate: 0.000075, weight_decay: 0.000001, dropout: 0.0, dice_weight: 1.2, positive_negative_ratio: "1:1", augmentation_strength: baseline}
        - {maximum_epochs: 25, learning_rate: 0.000125, weight_decay: 0.000001, dropout: 0.0, dice_weight: 1.2, positive_negative_ratio: "1:1", augmentation_strength: baseline}
        - {maximum_epochs: 25, learning_rate: 0.00015, weight_decay: 0.000001, dropout: 0.0, dice_weight: 1.2, positive_negative_ratio: "1:1", augmentation_strength: baseline}
        - {maximum_epochs: 25, learning_rate: 0.0001, weight_decay: 0.000003, dropout: 0.0, dice_weight: 1.2, positive_negative_ratio: "1:1", augmentation_strength: baseline}
        - {maximum_epochs: 25, learning_rate: 0.0001, weight_decay: 0.00001, dropout: 0.0, dice_weight: 1.2, positive_negative_ratio: "1:1", augmentation_strength: baseline}
        - {maximum_epochs: 25, learning_rate: 0.0001, weight_decay: 0.00003, dropout: 0.0, dice_weight: 1.2, positive_negative_ratio: "1:1", augmentation_strength: baseline}
        - {maximum_epochs: 25, learning_rate: 0.0001, weight_decay: 0.000001, dropout: 0.05, dice_weight: 1.2, positive_negative_ratio: "1:1", augmentation_strength: baseline}
        - {maximum_epochs: 25, learning_rate: 0.0001, weight_decay: 0.000001, dropout: 0.1, dice_weight: 1.2, positive_negative_ratio: "1:1", augmentation_strength: baseline}
        - {maximum_epochs: 25, learning_rate: 0.0001, weight_decay: 0.000001, dropout: 0.0, dice_weight: 1.0, positive_negative_ratio: "1:1", augmentation_strength: baseline}
        - {maximum_epochs: 25, learning_rate: 0.0001, weight_decay: 0.000001, dropout: 0.0, dice_weight: 1.1, positive_negative_ratio: "1:1", augmentation_strength: baseline}
        - {maximum_epochs: 25, learning_rate: 0.0001, weight_decay: 0.000001, dropout: 0.0, dice_weight: 1.3, positive_negative_ratio: "1:1", augmentation_strength: baseline}
        - {maximum_epochs: 25, learning_rate: 0.0001, weight_decay: 0.000001, dropout: 0.0, dice_weight: 1.4, positive_negative_ratio: "1:1", augmentation_strength: baseline}
        - {maximum_epochs: 25, learning_rate: 0.0001, weight_decay: 0.000001, dropout: 0.0, dice_weight: 1.2, positive_negative_ratio: "2:1", augmentation_strength: baseline}
