# Valid Direct launch shape. The portfolio owns scheduling; launch remains
# blocked until the V8 preflight reports launch_ready=true.
experiment:
  maximum_epochs: 10
  model_variant: dynunet
  feature_width: v8_dyn_compact_5
  architecture_budget: dynunet-15m-150m-v1
  upsample: deconv
  kernel_profile: standard
  residual_blocks: false
  deep_supervision_heads: 0
  convolutions_per_stage: 2
  stage_block_profile: uniform
  residual_profile: uniform
  dilation_profile: none
  skip_fusion: concat
  downsample: max_pool
  activation: PReLU
  norm: instance
  optimizer: Adam
  lr_schedule: polynomial
  loss_variant: dice_focal
  learning_rate: 0.00014676947772184417
  weight_decay: 0.000009170939006065463
  dropout: 0.08363354043325907
  dice_weight: 1.2833957004567855
  positive_negative_ratio: "2:1"
  augmentation_policy: intensity
  openevolve:
    population_size: 1
    maximum_generations: 3
    maximum_candidate_evaluations: 4
    maximum_wall_time_seconds: 115200
    maximum_model_calls: 3
    maximum_failed_candidates: 4
    maximum_consecutive_failures: 4
    maximum_artefact_bytes: 20000000
    random_seed: 20260823
    objective_direction: MAXIMIZE
    objective_threshold: null
    sandbox_policy_id: openevolve-sandbox-v1
    candidate_cpu_time_seconds: 2
    candidate_wall_time_seconds: 3.0
    candidate_memory_bytes: 268435456
    candidate_process_limit: 1
    candidate_output_bytes: 64000
    candidate_log_bytes: 8000
    candidate_file_count_limit: 8
    candidate_workspace_bytes: 1048576
    candidate_file_size_bytes: 64000

